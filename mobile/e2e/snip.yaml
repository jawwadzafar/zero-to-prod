# End to end, on an Android emulator and an iPhone simulator, against a real
# snip (.github/workflows/mobile-e2e.yml). Maestro finds things the way a screen
# reader does, by their text and accessibility labels, so this also checks
# that the labels are there.
#
#   maestro test -e APP_ID=com.anonymous.snipmobile -e KEY=snip_… e2e/snip.yaml
#
# APP_ID is the package name (Android) or bundle identifier (iOS) that
# `npx expo prebuild` picks while app.json sets none; chapter 18.8 explains
# why a store build needs its own. The workflow reads it from the build.
appId: ${APP_ID}
---
- launchApp:
    clearState: true # no saved key: start on the setup screen
- extendedWaitUntil:
    visible: "Connect to snip"
    timeout: 180000 # the first launch waits for Metro to bundle the app

# The address field already holds where snip listens: http://10.0.2.2:8080
# on the Android emulator (its name for the computer running it), and
# http://localhost:8080 on the iOS simulator (which shares the computer's network).
- tapOn: "API key"
- inputText: ${KEY}
- hideKeyboard
- tapOn: "Save and continue"
- extendedWaitUntil:
    visible: "Your links"
    timeout: 30000

# Create a link with a known slug.
- tapOn: "New short link"
- tapOn: "Long URL"
- inputText: "https://go.dev/doc/"
- tapOn: "Custom slug (optional)"
- inputText: "e2e-godoc"
- hideKeyboard
- tapOn: "Create short link"
- extendedWaitUntil:
    visible: "e2e-godoc"
    timeout: 30000

# Delete it, through the platform's own confirmation dialog.
- tapOn: "Delete e2e-godoc"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "android:id/button1" # the dialog's positive button
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Delete" # the alert's button; the row's is labelled "Delete e2e-godoc"
- extendedWaitUntil:
    notVisible: "e2e-godoc"
    timeout: 15000

# Forget the key: back to setup.
- tapOn: "Forget key"
- extendedWaitUntil:
    visible: "Connect to snip"
    timeout: 15000
