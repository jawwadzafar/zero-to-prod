name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build job (which runs npm install scripts) can only read.
# Only the deploy job, which runs no third-party packages, may publish to Pages.
permissions:
  contents: read

# One deployment at a time; don't cancel one that's already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read           # configure-pages reads the site's settings
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:refs
      - run: npm run check:diagrams
      - run: npm run check:ips
      - run: npm run check:sql
      # Only the deploy embeds passages for Ask's "search by meaning"
      # (scripts/build-ask-vectors.mjs); the library's native runtime is too big
      # to make every install download it.
      - run: npm i --no-save --no-audit --no-fund @huggingface/transformers@4.3.1
      # The in-browser terminal's Linux image, from the newest sandbox release
      # (.github/workflows/sandbox.yml). Without one, <Terminal /> says so.
      - name: Fetch the sandbox image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName --jq '[.[].tagName | select(startswith("sandbox-"))][0] // empty')
          if [ -n "$tag" ]; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern zero-to-prod-linux.bin --dir static/sandbox
          else
            echo "No sandbox release yet; the terminal will show as unavailable."
          fi
      - run: npm run build
      # Requires the one-time repo setting: Settings → Pages → Source: GitHub Actions.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
