name: Book (PDF)

# The whole handbook as one PDF (scripts/build-book.mjs), published as the
# "book" release, so this link always gets the newest copy:
# https://github.com/jawwadzafar/zero-to-prod/releases/download/book/zero-to-prod.pdf
on:
  push:
    branches: [main]
    paths: ["docs/**", "src/**", "scripts/build-book.mjs", "scripts/lib/**", ".github/workflows/book.yml"]
  workflow_dispatch:

# Least privilege, as in deploy.yml: the job that runs npm packages can only
# read; only the publish job, which runs no third-party code, may write.
permissions:
  contents: read

# Only the newest copy matters: a newer push replaces a build in progress.
concurrency:
  group: book
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Print every chapter and join them
        # The official image ships the browser that matches web/'s @playwright/test 1.64.1.
        run: |
          docker run --rm --ipc=host -v "$PWD:/w" -w /w mcr.microsoft.com/playwright:v1.64.1-noble sh -c '
            apt-get update -qq && apt-get install -y -qq poppler-utils >/dev/null &&
            cd web && npm ci --no-audit --no-fund && cd .. && node scripts/build-book.mjs'
      - uses: actions/upload-artifact@v7
        with:
          name: book
          path: book/zero-to-prod.pdf
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # to update the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: book
      - name: Update the "book" release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          notes="The whole handbook as one PDF, printed from commit ${SHA::7} on $(date -u +%Y-%m-%d). The web version has the interactive parts: https://jawwadzafar.github.io/zero-to-prod/"
          if gh release view book --repo "$REPO" >/dev/null 2>&1; then
            gh release edit book --repo "$REPO" --notes "$notes"
          else
            gh release create book --repo "$REPO" --target "$SHA" --title "Zero to Prod (PDF)" --notes "$notes" --latest=false
          fi
          gh release upload book zero-to-prod.pdf --repo "$REPO" --clobber
