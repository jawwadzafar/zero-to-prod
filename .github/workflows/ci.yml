name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  site:
    name: Site builds
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:sql
      - run: npm run build

  snip:
    name: snip (Go) — vet, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snip
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: snip
          POSTGRES_PASSWORD: snip
          POSTGRES_DB: snip
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U snip" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      SNIP_TEST_DATABASE_URL: postgres://snip:snip@localhost:5432/snip?sslmode=disable
      SNIP_TEST_REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: snip/go.mod
          cache-dependency-path: snip/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  snip-image:
    name: snip container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t snip:ci snip
      - name: Image starts and answers /healthz
        run: |
          docker run -d --name snip -p 8080:8080 snip:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && exit 0; sleep 1; done
          docker logs snip; exit 1
      - name: Chapter 9.2 dockerlab builds, runs as non-root, and stops gracefully
        run: |
          docker build -t dockerlab snip/examples/dockerlab
          docker build -f snip/examples/dockerlab/Dockerfile.naive -t dockerlab:naive snip/examples/dockerlab
          docker run -d --name dl -p 8081:8080 -e VERSION=ci dockerlab
          sleep 1; curl -fsS localhost:8081/ | tee /dev/stderr | grep -q 'version ci, running as uid 65532'
          docker stop -t 5 dl && docker logs dl 2>&1 | grep -q bye

  security:
    name: Vulnerability scans (chapter 9.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'           # the latest 1.25 patch: what golang:1.25-alpine ships
          cache-dependency-path: snip/go.sum
      - name: govulncheck — known vulnerabilities in code snip actually calls
        working-directory: snip
        run: |
          # The tool needs a newer Go to *build*; snip is analysed with its own 1.25 toolchain.
          GOTOOLCHAIN=auto go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Build the image and save it as a tarball
        run: |
          docker build -t snip:scan snip
          docker save snip:scan -o "$RUNNER_TEMP/snip.tar"
      - name: Trivy image scan (report only)
        # Scans the saved tarball: no Docker socket mounted into the scanner.
        run: |
          docker run --rm -v "$RUNNER_TEMP:/scan:ro" aquasec/trivy:0.74.0 \
            image --input /scan/snip.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0

  api-contract:
    name: snip OpenAPI contract is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npx -y @redocly/cli@latest lint --config snip/api/redocly.yaml snip/api/openapi.yaml

  snip-stack:
    name: snip full stack (compose) works end to end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snip
    steps:
      - uses: actions/checkout@v5
      - name: Start postgres, redis, 2 × api, worker, nginx
        run: docker compose up -d --build --wait
      - name: Smoke test through nginx
        run: |
          KEY=$(docker compose exec -T api snip keys create ci | grep -o 'snip_[A-Za-z0-9]*')
          SNIP_API_KEY="$KEY" ./scripts/smoke.sh http://localhost:8080
      - name: Both api copies serve traffic, and /metrics is blocked at the edge
        run: |
          KEY=$(docker compose exec -T api snip keys create ci2 | grep -o 'snip_[A-Za-z0-9]*')
          curl -fsS -X POST localhost:8080/api/links -H "Authorization: Bearer $KEY" -d '{"url":"https://go.dev","slug":"lbtest"}'
          for i in $(seq 1 10); do curl -s -o /dev/null localhost:8080/lbtest; done
          COPIES=$(docker compose logs api | grep '"route":"GET /{slug}"' | cut -d'|' -f1 | sort -u | wc -l)
          echo "api copies that served redirects: $COPIES"; test "$COPIES" -eq 2
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/metrics)" = 403
      - name: Scale to 4 api copies; nginx spreads load across all of them (chapter 8.6 lab)
        run: |
          docker compose up -d --scale api=4 --wait
          docker compose restart nginx
          sleep 2
          for i in $(seq 1 40); do curl -s -o /dev/null localhost:8080/lbtest; done
          COPIES=$(docker compose logs --since 30s api | grep '"route":"GET /{slug}"' | cut -d'|' -f1 | sort -u | wc -l)
          echo "api copies that served redirects: $COPIES"; test "$COPIES" -eq 4
      - name: The worker counts clicks
        run: |
          KEY=$(docker compose exec -T api snip keys create ci3 | grep -o 'snip_[A-Za-z0-9]*')
          curl -fsS -X POST localhost:8080/api/links -H "Authorization: Bearer $KEY" -d '{"url":"https://go.dev","slug":"counted"}'
          for i in $(seq 1 5); do curl -s -o /dev/null localhost:8080/counted; done
          for i in $(seq 1 20); do
            N=$(curl -s localhost:8080/api/links/counted -H "Authorization: Bearer $KEY" | jq .clicks)
            [ "$N" = 5 ] && exit 0; sleep 1
          done
          echo "clicks = $N, want 5"; docker compose logs worker; exit 1
      - name: Chapter 9.3 lab — look inside postgres and redis; prometheus finds the api copies
        run: |
          docker compose exec -T postgres psql -U snip -c "SELECT slug, clicks FROM links ORDER BY slug" | tee /dev/stderr | grep -q counted
          docker compose exec -T redis redis-cli XLEN snip:clicks
          docker compose --profile observability up -d prometheus
          for i in $(seq 1 30); do
            N=$(curl -s localhost:9090/api/v1/targets | jq '[.data.activeTargets[] | select(.health=="up")] | length')
            [ "${N:-0}" -ge 2 ] && echo "prometheus targets up: $N" && exit 0; sleep 2
          done
          curl -s localhost:9090/api/v1/targets; exit 1
      - name: Chapter 9.3 lab — data survives down/up (named volume), and is gone after down -v
        run: |
          docker compose --profile observability down
          docker compose up -d --wait
          docker compose exec -T postgres psql -U snip -tAc "SELECT count(*) FROM links WHERE slug='counted'" | grep -qx 1
          docker compose down -v
          test -z "$(docker volume ls -q --filter name=snip_pgdata)"
      - if: failure()
        run: docker compose logs
