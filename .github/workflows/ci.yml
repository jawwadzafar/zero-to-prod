name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only needs to read the code (chapter 11.2).
permissions:
  contents: read

# A newer push to the same pull request cancels the older, now-pointless run.
# Pushes to main get a unique group each (the run id), so every commit on main
# is tested and none are queued or cancelled (chapter 11.2).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Workflows are valid (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  site:
    name: Site builds
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:sql
      - run: npm run build

  alerts:
    name: Alert rules are valid and their unit tests pass (chapter 13.4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: promtool check and test
        run: |
          docker run --rm -v "$PWD/snip/deploy/prometheus/rules:/rules:ro" -w /rules \
            --entrypoint promtool prom/prometheus:v3.5.0 check rules snip-slo.yml
          docker run --rm -v "$PWD/snip/deploy/prometheus/rules:/rules:ro" -w /rules \
            --entrypoint promtool prom/prometheus:v3.5.0 test rules snip-slo_test.yml

  snip:
    name: snip (Go) — vet, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: snip
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: snip
          POSTGRES_PASSWORD: snip
          POSTGRES_DB: snip
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U snip" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      SNIP_TEST_DATABASE_URL: postgres://snip:snip@localhost:5432/snip?sslmode=disable
      SNIP_TEST_REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: snip/go.mod
          cache-dependency-path: snip/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - name: Chapter 13.6 lab — git bisect finds the commit that broke 3-character slugs
        run: |
          ./examples/bisectlab/make-repo.sh "$RUNNER_TEMP/bisect-demo"
          cd "$RUNNER_TEMP/bisect-demo"
          git bisect start HEAD "$(git rev-list --max-parents=0 HEAD)"
          git bisect run ./slug.sh abc | tee /tmp/bisect.txt
          grep -q "slug: tidy validation rules" /tmp/bisect.txt
      - name: Chapter 13.6 lab — CPU profile of snip under load with pprof
        run: |
          go build -o /tmp/snip ./cmd/snip && go build -o /tmp/loadgen ./examples/loadgen
          SNIP_HTTP_ADDR=:8095 SNIP_DEBUG_ADDR=localhost:6060 /tmp/snip serve > /tmp/snip.log 2>&1 &
          SNIP_PID=$!
          sleep 1
          KEY=$(grep -o 'snip_[A-Za-z0-9]*' /tmp/snip.log | head -1)
          curl -fsS -X POST localhost:8095/api/links -H "Authorization: Bearer $KEY" -d '{"url":"https://go.dev","slug":"hot"}'
          /tmp/loadgen -url http://localhost:8095/hot -c 20 -d 8s &
          LOADGEN_PID=$!
          sleep 1
          go tool pprof -top -cum -nodecount=40 "http://localhost:6060/debug/pprof/profile?seconds=5" | tee /tmp/prof.txt
          wait "$LOADGEN_PID"   # a bare `wait` would also wait for snip, which never exits (chapter 13.6)
          grep -q "httpapi.(\*Server).redirect" /tmp/prof.txt
          curl -s "localhost:6060/debug/pprof/goroutine?debug=1" | head -3
          kill "$SNIP_PID"

  ai:
    name: ai (Python) — lint, types, tests, live against snip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - uses: actions/setup-go@v6
        with:
          go-version-file: snip/go.mod
          cache-dependency-path: snip/go.sum
      - run: uv sync --locked                 # fails if uv.lock is out of date with pyproject.toml
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - name: Tests, including the live round trip against a real snip (chapter 14.1 lab)
        run: |
          (cd ../snip && go build -o /tmp/snip ./cmd/snip)
          SNIP_HTTP_ADDR=:8080 /tmp/snip serve > /tmp/snip.log 2>&1 &
          sleep 1
          set -o pipefail                     # without it, tee would hide a pytest failure (chapter 13.6)
          SNIP_URL=http://localhost:8080 SNIP_API_KEY="$(grep -o 'snip_[A-Za-z0-9]*' /tmp/snip.log | head -1)" \
            uv run pytest -v | tee /tmp/pytest.txt
          grep -q "test_round_trip_against_real_snip PASSED" /tmp/pytest.txt   # the live test ran, not skipped
      - name: Chapter 14.2 lab — train the phishing-link classifier from scratch
        run: uv run python -m snipai.abuse
      - name: Chapter 14.3 lab — train a tokenizer and a tiny language model on the handbook
        run: uv run python -m snipai.tinylm
      - name: Chapter 14.4 lab — describe real pages with the offline fake model; unsafe URLs are refused
        run: |
          uv run python -m snipai.describe https://go.dev/ https://www.python.org/ http://169.254.169.254/latest/meta-data/ | tee /tmp/describe.txt
          grep -q "refusing to fetch a non-public address: 169.254.169.254" /tmp/describe.txt
          grep -q "description: " /tmp/describe.txt

  ai-ollama:
    name: ai with a real open model (Ollama)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - run: uv sync --locked
      - name: Install Ollama and pull a small model (chapters 14.4 and 14.11)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          for _ in $(seq 1 30); do curl -fsS localhost:11434/api/version && break; sleep 1; done
          ollama pull qwen2.5:0.5b
      - name: Chapter 14.4 lab — describe real pages with a local model, whole and streamed
        env:
          SNIPAI_PROVIDER: ollama
        run: |
          uv run python -m snipai.describe https://go.dev/ https://www.python.org/ | tee /tmp/describe.txt
          grep -q "description: " /tmp/describe.txt
          uv run python -m snipai.describe --stream https://go.dev/

  snip-image:
    name: snip container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t snip:ci snip
      - name: Image starts and answers /healthz
        run: |
          docker run -d --name snip -p 8080:8080 snip:ci
          for _ in $(seq 1 20); do curl -fsS localhost:8080/healthz && exit 0; sleep 1; done
          docker logs snip; exit 1
      - name: Chapter 9.2 dockerlab builds, runs as non-root, and stops gracefully
        run: |
          docker build -t dockerlab snip/examples/dockerlab
          docker build -f snip/examples/dockerlab/Dockerfile.naive -t dockerlab:naive snip/examples/dockerlab
          docker run -d --name dl -p 8081:8080 -e VERSION=ci dockerlab
          sleep 1; curl -fsS localhost:8081/ | tee /dev/stderr | grep -q 'version ci, running as uid 65532'
          docker stop -t 5 dl && docker logs dl 2>&1 | grep -q bye

  security:
    name: Vulnerability scans (chapter 9.4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'           # the latest 1.25 patch: what golang:1.25-alpine ships
          cache-dependency-path: snip/go.sum
      - name: govulncheck — known vulnerabilities in code snip actually calls
        working-directory: snip
        run: |
          # The tool needs a newer Go to *build*; snip is analysed with its own 1.25 toolchain.
          GOTOOLCHAIN=auto go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Build the image and save it as a tarball
        run: |
          docker build -t snip:scan snip
          docker save snip:scan -o "$RUNNER_TEMP/snip.tar"
      - name: Trivy image scan (report only)
        # Scans the saved tarball: no Docker socket mounted into the scanner.
        run: |
          docker run --rm -v "$RUNNER_TEMP:/scan:ro" aquasec/trivy:0.74.0 \
            image --input /scan/snip.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0

  api-contract:
    name: snip OpenAPI contract is valid
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npx -y @redocly/cli@latest lint --config snip/api/redocly.yaml snip/api/openapi.yaml

  snip-stack:
    name: snip full stack (compose) works end to end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: snip
    steps:
      - uses: actions/checkout@v5
      - name: Start postgres, redis, 2 × api, worker, nginx
        run: docker compose up -d --build --wait
      - name: Smoke test through nginx
        run: |
          KEY=$(docker compose exec -T api snip keys create ci | grep -o 'snip_[A-Za-z0-9]*')
          SNIP_API_KEY="$KEY" ./scripts/smoke.sh http://localhost:8080
      - name: Both api copies serve traffic, and /metrics is blocked at the edge
        run: |
          KEY=$(docker compose exec -T api snip keys create ci2 | grep -o 'snip_[A-Za-z0-9]*')
          curl -fsS -X POST localhost:8080/api/links -H "Authorization: Bearer $KEY" -d '{"url":"https://go.dev","slug":"lbtest"}'
          for _ in $(seq 1 10); do curl -s -o /dev/null localhost:8080/lbtest; done
          COPIES=$(docker compose logs api | grep '"route":"GET /{slug}"' | cut -d'|' -f1 | sort -u | wc -l)
          echo "api copies that served redirects: $COPIES"; test "$COPIES" -eq 2
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/metrics)" = 403
      - name: Scale to 4 api copies; nginx spreads load across all of them (chapter 8.6 lab)
        run: |
          docker compose up -d --scale api=4 --wait
          docker compose restart nginx
          sleep 2
          for _ in $(seq 1 40); do curl -s -o /dev/null localhost:8080/lbtest; done
          COPIES=$(docker compose logs --since 30s api | grep '"route":"GET /{slug}"' | cut -d'|' -f1 | sort -u | wc -l)
          echo "api copies that served redirects: $COPIES"; test "$COPIES" -eq 4
      - name: The worker counts clicks
        run: |
          KEY=$(docker compose exec -T api snip keys create ci3 | grep -o 'snip_[A-Za-z0-9]*')
          curl -fsS -X POST localhost:8080/api/links -H "Authorization: Bearer $KEY" -d '{"url":"https://go.dev","slug":"counted"}'
          for _ in $(seq 1 5); do curl -s -o /dev/null localhost:8080/counted; done
          for _ in $(seq 1 20); do
            N=$(curl -s localhost:8080/api/links/counted -H "Authorization: Bearer $KEY" | jq .clicks)
            [ "$N" = 5 ] && exit 0; sleep 1
          done
          echo "clicks = $N, want 5"; docker compose logs worker; exit 1
      - name: Chapter 9.3 lab — look inside postgres and redis; prometheus finds the api copies
        run: |
          docker compose exec -T postgres psql -U snip -c "SELECT slug, clicks FROM links ORDER BY slug" | tee /dev/stderr | grep -q counted
          docker compose exec -T redis redis-cli XLEN snip:clicks
          docker compose --profile observability up -d prometheus
          for _ in $(seq 1 30); do
            N=$(curl -s localhost:9090/api/v1/targets | jq '[.data.activeTargets[] | select(.health=="up")] | length')
            [ "${N:-0}" -ge 2 ] && echo "prometheus targets up: $N" && exit 0; sleep 2
          done
          curl -s localhost:9090/api/v1/targets; exit 1
      - name: Chapter 13.2 lab — PromQL answers questions; Grafana has snip's dashboard
        run: |
          for _ in $(seq 1 30); do curl -s -o /dev/null localhost:8080/counted; done
          sleep 25                                    # let Prometheus scrape a couple of times
          q() { curl -s --data-urlencode "query=$1" localhost:9090/api/v1/query | jq -c '.data.result'; }
          echo "--- requests per second, by route";    q 'sum by (route) (rate(snip_http_requests_total[1m]))'
          echo "--- p99 latency (seconds)";            q 'histogram_quantile(0.99, sum by (le) (rate(snip_http_request_duration_seconds_bucket[5m])))'
          echo "--- redirect cache hit ratio";         q 'sum(rate(snip_redirects_total{cache="hit"}[5m])) / sum(rate(snip_redirects_total[5m]))'
          echo "--- worker clicks processed (total)";  q 'sum(snip_worker_clicks_processed_total)'
          echo "--- worker lag";                       q 'sum(snip_worker_lag_events)'
          q 'sum(rate(snip_http_requests_total[1m]))' | jq -e '.[0].value[1] | tonumber > 0'
          q 'sum(snip_worker_clicks_processed_total)' | jq -e '.[0].value[1] | tonumber > 0'
          curl -s localhost:9090/api/v1/rules | jq -e '.data.groups[] | select(.name == "snip-slo")' > /dev/null   # SLO rules loaded (13.4)
          docker compose --profile observability up -d grafana
          for _ in $(seq 1 30); do curl -fsS localhost:3000/api/health > /dev/null 2>&1 && break; sleep 2; done
          curl -s 'localhost:3000/api/search?query=snip' | jq -e '.[] | select(.uid == "snip-overview")'
          curl -s localhost:3000/api/datasources/uid/prometheus/health | jq -e '.status == "OK"'
      - name: Chapter 13.3 lab — traces reach Jaeger, one per request, with cache spans
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
        run: |
          docker compose --profile observability up -d --wait
          docker compose restart nginx                   # the api copies were recreated with new IPs (chapter 8.6)
          sleep 3
          for _ in $(seq 1 5); do curl -s -o /dev/null localhost:8080/counted; done
          sleep 8                                        # spans are batched before export
          curl -s localhost:16686/api/v3/services | jq -e '.services | index("snip-api")'
          START=$(date -u -d '-10 min' +%Y-%m-%dT%H:%M:%SZ); END=$(date -u -d '+1 min' +%Y-%m-%dT%H:%M:%SZ)
          curl -s "localhost:16686/api/v3/traces?query.service_name=snip-api&query.start_time_min=$START&query.start_time_max=$END" \
            | jq -r '[.result.resourceSpans[].scopeSpans[].spans[]] | group_by(.traceId)[] | [.[].name] | join(" | ")' | tee /tmp/traces.txt
          grep -q "cache.GetURL" /tmp/traces.txt
          docker compose logs api | grep -m1 '"trace_id"'  # the same trace IDs are in the logs
      - name: Chapter 13.5 lab — game day, Redis frozen then stopped; snip degrades but keeps redirecting
        run: |
          KEY=$(docker compose exec -T api snip keys create gameday | grep -o 'snip_[A-Za-z0-9]*')
          curl -fsS -X POST localhost:8080/api/links -H "Authorization: Bearer $KEY" -d '{"url":"https://go.dev","slug":"gameday"}'
          time_redirects() { for _ in 1 2 3; do curl -s -o /dev/null -m 2 -w '%{http_code} %{time_total}s\n' localhost:8080/gameday; done | tee /tmp/gd.txt; test "$(grep -c '^302 ' /tmp/gd.txt)" = 3; }
          echo "--- redis frozen";  docker compose pause redis
          time_redirects
          curl -s localhost:8080/readyz | tee /dev/stderr | jq -e '.ready == true and .degraded == true'
          docker compose unpause redis
          echo "--- redis stopped"; docker compose stop redis
          time_redirects
          curl -s localhost:8080/readyz | jq -e '.ready == true and .degraded == true'
          echo "--- redis back";    docker compose start redis
          for _ in $(seq 1 20); do curl -s localhost:8080/readyz | jq -e '.degraded == false' && break; sleep 1; done
          curl -s localhost:8080/readyz | jq -e '.degraded == false'
          docker compose logs api | grep -c '"click not recorded"'
      - name: Chapter 9.3 lab — data survives down/up (named volume), and is gone after down -v
        run: |
          docker compose --profile observability down
          docker compose up -d --wait
          docker compose exec -T postgres psql -U snip -tAc "SELECT count(*) FROM links WHERE slug='counted'" | grep -qx 1
          docker compose down -v
          test -z "$(docker volume ls -q --filter name=snip_pgdata)"
      - if: failure()
        run: docker compose logs

  snip-k8s:
    name: snip on Kubernetes (kind) works end to end
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0
          cluster_name: z2p
      - name: Build snip and load the image into the cluster (chapter 10.2 lab)
        run: |
          docker build -t snip:dev snip
          kind load docker-image snip:dev --name z2p
      - name: Apply the manifests
        run: kubectl apply -k snip/deploy/k8s/overlays/kind
      - name: Wait for every workload to be ready
        timeout-minutes: 8
        run: |
          for _ in $(seq 1 45); do
            kubectl -n snip get pods --no-headers | tee /tmp/pods.txt
            if [ -s /tmp/pods.txt ] && ! grep -vqE '\s1/1\s+Running' /tmp/pods.txt; then break; fi
            echo "--- waiting"; sleep 10
          done
          timeout 120 kubectl -n snip rollout status statefulset/postgres --timeout=100s
          timeout 120 kubectl -n snip rollout status deploy/api --timeout=100s
          timeout 120 kubectl -n snip rollout status deploy/worker --timeout=100s
          kubectl -n snip get pods,svc,pvc
      - name: Smoke test through the Service
        run: |
          kubectl -n snip port-forward svc/api 8080:80 > /tmp/pf.log 2>&1 &
          sleep 3
          KEY=$(kubectl -n snip exec deploy/api -- snip keys create ci | grep -o 'snip_[A-Za-z0-9]*')
          SNIP_API_KEY="$KEY" snip/scripts/smoke.sh http://localhost:8080
      - name: Self-healing — a deleted Pod is replaced (chapter 10.1 lab)
        run: |
          POD=$(kubectl -n snip get pod -l app.kubernetes.io/name=api -o name | head -1)
          kubectl -n snip delete "$POD" --wait=false
          sleep 2
          kubectl -n snip wait --for=condition=Available deploy/api --timeout=120s
          for _ in $(seq 1 60); do
            R=$(kubectl -n snip get deploy api -o jsonpath='{.status.readyReplicas}')
            [ "$R" = 2 ] && kubectl -n snip get pods -l app.kubernetes.io/name=api && exit 0; sleep 2
          done
          exit 1
      - name: Rolling update with zero failed requests (chapter 10.2 lab)
        run: |
          # shellcheck disable=SC2016 # the $(...) must expand inside the probe Pod, not here
          kubectl -n snip run probe --image=curlimages/curl:8.22.0 --restart=Never --command -- sh -c '
            ok=0; bad=0; end=$(( $(date +%s) + 45 ))
            while [ "$(date +%s)" -lt "$end" ]; do
              if curl -fs -m 2 http://api/healthz > /dev/null; then ok=$((ok+1)); else bad=$((bad+1)); fi
              sleep 0.1
            done
            echo "ok=$ok bad=$bad"'
          kubectl -n snip wait --for=condition=Ready pod/probe --timeout=60s
          kubectl -n snip set env deploy/api SNIP_LOG_LEVEL=debug        # changes the Pod template → rollout
          kubectl -n snip rollout status deploy/api --timeout=180s
          kubectl -n snip wait --for=jsonpath='{.status.phase}'=Succeeded pod/probe --timeout=120s
          RESULT=$(kubectl -n snip logs probe); echo "$RESULT"
          echo "$RESULT" | grep -q ' bad=0$'
      - name: Chapter 10.4 lab — Secrets are only base64; config rolls out on restart; data survives its Pod
        run: |
          kubectl -n snip get secret snip-db -o jsonpath='{.data.SNIP_DATABASE_URL}' | base64 -d | grep -q snip-dev-only
          kubectl -n snip patch configmap snip-config --type merge -p '{"data":{"SNIP_LOG_LEVEL":"debug"}}'
          kubectl -n snip rollout restart deploy/api
          timeout 200 kubectl -n snip rollout status deploy/api --timeout=180s
          kubectl -n snip patch configmap snip-config --type merge -p '{"data":{"SNIP_LOG_LEVEL":"info"}}'
          kubectl -n snip get pvc data-postgres-0
          kubectl -n snip exec postgres-0 -- psql -U snip -c "INSERT INTO links (slug, url, owner_id) SELECT 'survivor', 'https://go.dev', id FROM api_keys LIMIT 1"
          kubectl -n snip delete pod postgres-0
          sleep 5
          timeout 150 kubectl -n snip wait --for=condition=Ready pod/postgres-0 --timeout=120s
          kubectl -n snip exec postgres-0 -- psql -U snip -c "SELECT slug, url FROM links WHERE slug='survivor'" | tee /dev/stderr | grep -q survivor
      - name: Chapter 10.3 lab — endpoints and DNS
        run: |
          timeout 200 kubectl -n snip rollout status deploy/api --timeout=180s
          kubectl -n snip get endpointslices -l kubernetes.io/service-name=api -o wide
          kubectl -n snip run dns --image=alpine:3.22 --restart=Never -- \
            sh -c 'nslookup api.snip.svc.cluster.local; wget -qO- http://api/healthz'
          timeout 150 kubectl -n snip wait --for=jsonpath='{.status.phase}'=Succeeded pod/dns --timeout=120s || true
          kubectl -n snip logs dns | tee /tmp/dns.txt
          kubectl -n snip delete pod dns
          grep -q '"status":"ok"' /tmp/dns.txt
      - name: Chapter 10.3 lab — NetworkPolicies block strangers, allow snip
        run: |
          kubectl -n snip run intruder --image=alpine:3.22 --restart=Never -- \
            sh -c 'nc -z -w 3 postgres 5432 && echo "postgres: OPEN" || echo "postgres: blocked"; wget -qO- -T 3 http://api/healthz'
          timeout 150 kubectl -n snip wait --for=jsonpath='{.status.phase}'=Succeeded pod/intruder --timeout=120s || true
          kubectl -n snip logs intruder | tee /tmp/intruder.txt
          kubectl -n snip delete pod intruder
          grep -q 'postgres: blocked' /tmp/intruder.txt
          grep -q '"status":"ok"' /tmp/intruder.txt
          kubectl -n snip port-forward svc/api 8082:80 > /dev/null 2>&1 &
          sleep 3
          KEY=$(kubectl -n snip exec deploy/api -- snip keys create np | grep -o 'snip_[A-Za-z0-9]*')
          SNIP_API_KEY="$KEY" snip/scripts/smoke.sh http://localhost:8082
      - name: Chapter 10.3 lab — Gateway API with Envoy Gateway
        run: |
          helm install eg oci://docker.io/envoyproxy/gateway-helm --version v1.9.1 \
            -n envoy-gateway-system --create-namespace --wait --timeout 5m
          kubectl apply -f snip/deploy/k8s/gateway/gateway.yaml
          # On kind the proxy's LoadBalancer Service never gets an external address, so the
          # Gateway is Accepted but not Programmed. Wait for the proxy Pods instead.
          timeout 200 kubectl -n snip wait --for=condition=Accepted gateway/snip --timeout=180s
          for _ in $(seq 1 60); do
            kubectl -n envoy-gateway-system get pods -l gateway.envoyproxy.io/owning-gateway-name=snip --no-headers 2>/dev/null | grep -q . && break; sleep 2
          done
          timeout 200 kubectl -n envoy-gateway-system wait --for=condition=Ready pod -l gateway.envoyproxy.io/owning-gateway-name=snip --timeout=180s
          SVC=$(kubectl -n envoy-gateway-system get svc -l gateway.envoyproxy.io/owning-gateway-name=snip -o name)
          kubectl -n envoy-gateway-system port-forward "$SVC" 8888:80 > /dev/null 2>&1 &
          for _ in $(seq 1 30); do curl -fsS -H "Host: snip.localhost" localhost:8888/healthz && break; sleep 2; done
          curl -fsS -H "Host: snip.localhost" localhost:8888/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: other.example' localhost:8888/healthz)" = 404
      - name: Chapter 11.3 lab — canary release with weighted routing
        run: |
          kubectl apply -f snip/deploy/k8s/canary/canary.yaml
          timeout 200 kubectl -n snip rollout status deploy/api-canary --timeout=180s
          kubectl apply -f snip/deploy/k8s/canary/route.yaml
          SVC=$(kubectl -n envoy-gateway-system get svc -l gateway.envoyproxy.io/owning-gateway-name=snip -o name)
          kubectl -n envoy-gateway-system port-forward "$SVC" 8889:80 > /dev/null 2>&1 &
          sleep 8
          count() {  # how many of 200 requests the canary answered
            for _ in $(seq 1 200); do
              curl -s -D - -o /dev/null -H "Host: snip.localhost" localhost:8889/healthz | grep -i '^x-snip-track'
            done | grep -ci canary || true
          }
          C=$(count); echo "canary answered $C of 200 at weight 10"
          [ "$C" -ge 5 ] && [ "$C" -le 50 ]
          sed -e 's/weight: 90/weight: 0/' -e 's/weight: 10/weight: 100/' snip/deploy/k8s/canary/route.yaml | kubectl apply -f -
          for _ in $(seq 1 20); do C=$(count); [ "$C" = 200 ] && break; sleep 3; done
          echo "canary answered $C of 200 after promotion"; [ "$C" = 200 ]
          kubectl apply -f snip/deploy/k8s/gateway/gateway.yaml           # back to the plain route
          kubectl delete -f snip/deploy/k8s/canary/canary.yaml
      - name: Chapter 10.5 lab — break it four ways
        run: |
          set -x
          # 1. bad image tag: new Pod can't pull; old Pods keep serving; undo
          kubectl -n snip set image deploy/api api=ghcr.io/jawwadzafar/snip:does-not-exist
          for _ in $(seq 1 30); do kubectl -n snip get pods -l app.kubernetes.io/name=api | grep -qE 'ErrImagePull|ImagePullBackOff' && break; sleep 3; done
          kubectl -n snip get pods -l app.kubernetes.io/name=api | grep -E 'ErrImagePull|ImagePullBackOff'
          test "$(kubectl -n snip get deploy api -o jsonpath='{.status.readyReplicas}')" = 2
          kubectl -n snip rollout undo deploy/api
          timeout 200 kubectl -n snip rollout status deploy/api --timeout=180s
          # 2. config the app rejects → CrashLoopBackOff, reason in --previous logs
          kubectl -n snip set env deploy/api SNIP_RATE_LIMIT=0
          for _ in $(seq 1 40); do
            NEW=$(kubectl -n snip get pods -l app.kubernetes.io/name=api --sort-by=.metadata.creationTimestamp -o name | tail -1)
            kubectl -n snip logs "$NEW" --previous 2>/dev/null | grep -q 'SNIP_RATE_LIMIT: must be a positive integer' && break
            sleep 3
          done
          kubectl -n snip logs "$NEW" --previous | grep 'SNIP_RATE_LIMIT: must be a positive integer'
          kubectl -n snip set env deploy/api SNIP_RATE_LIMIT-
          timeout 200 kubectl -n snip rollout status deploy/api --timeout=180s
          # 3. impossible request → Pending, FailedScheduling
          kubectl -n snip create deployment greedy --image=ghcr.io/jawwadzafar/snip:main
          kubectl -n snip set resources deploy/greedy --requests=cpu=64
          for _ in $(seq 1 30); do kubectl -n snip describe pod -l app=greedy | grep -q 'Insufficient cpu' && break; sleep 2; done
          kubectl -n snip describe pod -l app=greedy | grep 'Insufficient cpu'
          kubectl -n snip delete deploy greedy
          # 4. ephemeral debug container in a shell-less Pod. Wait for old Pods from the
          #    rollouts above to finish terminating, and pick a live one.
          for _ in $(seq 1 60); do
            [ "$(kubectl -n snip get pods -l app.kubernetes.io/name=api --no-headers | wc -l)" = 2 ] && break; sleep 2
          done
          POD=pod/$(kubectl -n snip get pods -l app.kubernetes.io/name=api \
            -o go-template='{{range .items}}{{if not .metadata.deletionTimestamp}}{{.metadata.name}}{{"\n"}}{{end}}{{end}}' | head -1)
          kubectl -n snip debug "$POD" --image=alpine:3.22 --target=api --profile=general --container=dbg -- \
            sh -c 'ps; wget -qO- localhost:8080/readyz; echo; cat /proc/1/environ | tr "\0" "\n" | grep SNIP_LOG'
          for _ in $(seq 1 30); do kubectl -n snip logs "$POD" -c dbg 2>/dev/null | grep -q SNIP_LOG_LEVEL && break; sleep 2; done
          kubectl -n snip logs "$POD" -c dbg | tee /dev/stderr | grep -q SNIP_LOG_LEVEL
      - name: Chapter 10.5 lab — metrics-server, kubectl top, HPA
        run: |
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm install metrics-server metrics-server/metrics-server -n kube-system \
            --set 'args={--kubelet-insecure-tls}' --wait --timeout 5m
          for _ in $(seq 1 40); do kubectl -n snip top pods 2>/dev/null && break; sleep 5; done
          kubectl -n snip top pods
          for _ in $(seq 1 40); do kubectl -n snip get hpa api | grep -q 'cpu: [0-9]' && break; sleep 5; done
          kubectl -n snip get hpa api | tee /dev/stderr | grep -q 'cpu: [0-9]'
      - name: Chapter 10.6 lab — snip's Helm chart installs, upgrades, rolls back
        run: |
          set -x
          helm lint snip/deploy/helm/snip
          helm install snip snip/deploy/helm/snip -n snip-helm --create-namespace \
            --set image.repository=snip --set image.tag=dev --wait --timeout 6m
          helm -n snip-helm list
          kubectl -n snip-helm get pods
          kubectl -n snip-helm port-forward svc/snip-api 8084:80 > /dev/null 2>&1 &
          sleep 3
          KEY=$(kubectl -n snip-helm exec deploy/snip-api -- snip keys create helm | grep -o 'snip_[A-Za-z0-9]*')
          SNIP_API_KEY="$KEY" snip/scripts/smoke.sh http://localhost:8084
          BEFORE=$(kubectl -n snip-helm get deploy snip-api -o jsonpath='{.spec.template.metadata.annotations.checksum/config}')
          helm -n snip-helm upgrade snip snip/deploy/helm/snip --reuse-values --set config.logLevel=debug --wait --timeout 5m
          AFTER=$(kubectl -n snip-helm get deploy snip-api -o jsonpath='{.spec.template.metadata.annotations.checksum/config}')
          test "$BEFORE" != "$AFTER"                              # a config change rolled the Pods
          kubectl -n snip-helm get cm snip-config -o jsonpath='{.data.SNIP_LOG_LEVEL}' | grep -qx debug
          helm -n snip-helm rollback snip 1 --wait --timeout 5m
          kubectl -n snip-helm get cm snip-config -o jsonpath='{.data.SNIP_LOG_LEVEL}' | grep -qx info
          helm -n snip-helm history snip
          helm -n snip-helm uninstall snip --wait
      - name: Chapter 10.1 lab — the published image, imperative commands, self-healing, scaling
        run: |
          kubectl create deployment snip --image=ghcr.io/jawwadzafar/snip:main --replicas=3
          kubectl rollout status deployment/snip --timeout=180s
          kubectl delete pod "$(kubectl get pods -l app=snip -o name | head -1 | cut -d/ -f2)" --wait=false
          sleep 3
          kubectl rollout status deployment/snip --timeout=120s
          kubectl scale deployment/snip --replicas=5
          kubectl rollout status deployment/snip --timeout=120s
          test "$(kubectl get deploy snip -o jsonpath='{.status.readyReplicas}')" = 5
          kubectl port-forward deployment/snip 8081:8080 > /dev/null 2>&1 &
          sleep 3; curl -fsS localhost:8081/healthz
          kubectl delete deployment snip
      - if: failure()
        run: |
          kubectl -n snip get all,pvc,events --sort-by=.metadata.creationTimestamp || true
          kubectl -n snip describe pods | grep -A15 '^Events:' || true
          kubectl -n snip logs -l app.kubernetes.io/name=api --tail=20 || true
          kubectl -n snip get gateway,httproute -o yaml | grep -A30 '^  status:' || true
          kubectl -n envoy-gateway-system get pods,svc || true
          kubectl -n envoy-gateway-system logs deploy/envoy-gateway --tail=30 || true

  snip-gitops:
    name: snip via GitOps (Argo CD on kind)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0
          cluster_name: gitops
      - name: Install Argo CD and metrics-server (chapter 11.4 lab)
        run: |
          kubectl create namespace argocd
          kubectl apply -n argocd --server-side --force-conflicts \
            -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.3/manifests/install.yaml
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm install metrics-server metrics-server/metrics-server -n kube-system \
            --set 'args={--kubelet-insecure-tls}' --wait --timeout 5m
          timeout 400 kubectl -n argocd wait --for=condition=Available deploy --all --timeout=380s
          timeout 200 kubectl -n argocd rollout status statefulset/argocd-application-controller --timeout=180s
      - name: Point Argo CD at this commit of the repository and let it sync
        env:
          SHA: ${{ github.sha }}
        run: |
          sed "s/targetRevision: main/targetRevision: $SHA/" snip/deploy/argocd/application.yaml | kubectl apply -f -
          for _ in $(seq 1 90); do
            S=$(kubectl -n argocd get application snip -o jsonpath='{.status.sync.status} {.status.health.status}')
            echo "$S"; [ "$S" = "Synced Healthy" ] && break; sleep 5
          done
          kubectl -n argocd get application snip
          [ "$S" = "Synced Healthy" ]
          kubectl -n snip get pods
      - name: Drift is undone — a hand-edited ConfigMap reverts, a deleted Deployment returns
        run: |
          kubectl -n snip patch configmap snip-config --type merge -p '{"data":{"SNIP_LOG_LEVEL":"debug"}}'
          for _ in $(seq 1 60); do
            L=$(kubectl -n snip get configmap snip-config -o jsonpath='{.data.SNIP_LOG_LEVEL}')
            [ "$L" = info ] && break; sleep 2
          done
          echo "SNIP_LOG_LEVEL is back to: $L"; [ "$L" = info ]
          kubectl -n snip delete deployment worker
          for _ in $(seq 1 60); do kubectl -n snip get deployment worker > /dev/null 2>&1 && break; sleep 2; done
          kubectl -n snip get deployment worker
      - if: failure()
        run: |
          kubectl -n argocd get application snip -o yaml | grep -A40 '^status:' || true
          kubectl -n snip get pods,events || true

  terraform:
    name: Terraform — snip's local stack applies, is idempotent, detects drift, destroys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: snip/infra/local
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: Format and validate (chapter 12.5 lab)
        run: |
          terraform fmt -check -recursive ..
          terraform init -input=false
          terraform validate
      - name: Apply, then use snip through what Terraform built
        run: |
          terraform apply -auto-approve -input=false
          terraform output
          for _ in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 2; done
          KEY=$(docker exec snip-tf-api snip keys create tf | grep -o 'snip_[A-Za-z0-9]*')
          SNIP_API_KEY="$KEY" ../../scripts/smoke.sh http://localhost:8080
      - name: A second plan changes nothing (idempotent); deleting a container is drift
        run: |
          set +e
          terraform plan -detailed-exitcode -input=false > /dev/null; CODE=$?
          set -e
          echo "plan exit code after apply: $CODE (0 = no changes)"; [ "$CODE" = 0 ]
          docker rm -f snip-tf-worker-0
          set +e
          terraform plan -detailed-exitcode -input=false -no-color | tee /tmp/plan.txt; CODE=${PIPESTATUS[0]}   # plan's code, not tee's
          set -e
          echo "plan exit code after drift: $CODE (2 = changes)"; [ "$CODE" = 2 ]
          grep -q "1 to add" /tmp/plan.txt
          terraform apply -auto-approve -input=false
          docker ps --format '{{.Names}}' | grep -q snip-tf-worker-0
      - name: Change a variable, then destroy everything
        run: |
          terraform apply -auto-approve -input=false -var workers=2
          test "$(docker ps --format '{{.Names}}' | grep -c snip-tf-worker)" = 2
          terraform destroy -auto-approve -input=false
          test -z "$(docker ps -aq --filter name=snip-tf-)"
      - name: The AWS configuration is valid (validated, never applied — it costs money)
        working-directory: snip/infra/aws
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Misconfiguration scan of all infrastructure code (blocking, chapter 12.6)
        working-directory: snip
        run: |
          # Findings were fixed or accepted with written reasons (#trivy:ignore comments),
          # so any NEW high or critical finding now fails the build.
          for dir in infra deploy; do
            docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.74.0 \
              config --severity HIGH,CRITICAL --exit-code 1 "/src/$dir"
          done
