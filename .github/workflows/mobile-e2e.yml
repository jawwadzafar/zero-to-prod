name: Mobile app on Android and iOS (end to end)

# Chapter 18.7: Jest can't show that the app runs on a phone. This builds the
# app, starts it on an Android emulator and an iPhone simulator next to a real
# snip, and drives it with Maestro (mobile/e2e/snip.yaml): connect with a key,
# create a link, see it listed, delete it, forget the key. Separate from
# ci.yml because each job takes about a quarter of an hour.
on:
  push:
    branches: [main]
    paths: ["mobile/**", "snip/**", ".github/workflows/mobile-e2e.yml"]
  schedule:
    - cron: "23 4 * * 1"   # weekly, Monday 04:23 UTC: catches drift in the emulator image and tools
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-e2e
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      MAESTRO_VERSION: 2.12.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Android builds and emulators are large; the runner starts with tools
      # this job never uses (.NET, Haskell, CodeQL), so make room first.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # The emulator needs hardware virtualisation; let the runner's user use it.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Start snip and make a key
        working-directory: snip
        run: |
          docker compose up -d --build --wait
          key=$(docker compose exec -T api snip keys create e2e --operator ci | grep -o 'snip_[A-Za-z0-9]*')
          echo "::add-mask::$key"   # a throwaway key, but keys never belong in logs (chapter 7.6)
          echo "SNIP_KEY=$key" >> "$GITHUB_ENV"

      - name: Build the Android app (debug)
        working-directory: mobile
        env:
          CI: "1"
        run: |
          npm ci
          npx expo prebuild --platform android --no-install   # generates android/ from app.json (chapter 18.8)
          # Only the emulator's CPU type (x86_64), not the four a store build needs.
          cd android && ./gradlew assembleDebug --no-daemon --stacktrace -PreactNativeArchitectures=x86_64
          df -h /
          # The package name, read from the built app itself (Maestro's appId).
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          echo "APP_ID=$("$aapt2" dump packagename app/build/outputs/apk/debug/app-debug.apk)" >> "$GITHUB_ENV"

      # A debug build loads its JavaScript from Metro, at 10.0.2.2:8081 from
      # inside the emulator; start it now so it's ready when the app opens.
      - name: Start Metro
        working-directory: mobile
        env:
          CI: "1"
        run: |
          nohup npx expo start --port 8081 > metro.log 2>&1 &
          timeout 120 sh -c 'until curl -s localhost:8081/status | grep -q running; do sleep 2; done'
          # Bundle once now, so the app's first launch is served from Metro's
          # cache; a cold bundle can take minutes on a CI runner.
          curl -sf --max-time 900 -o /dev/null "localhost:8081/node_modules/expo-router/entry.bundle?platform=android&dev=true&minify=false"

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run the app on an emulator and drive it
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install mobile/android/app/build/outputs/apk/debug/app-debug.apk
            maestro test -e APP_ID="$APP_ID" -e KEY="$SNIP_KEY" --format junit --output maestro-report.xml mobile/e2e/snip.yaml

      - name: Keep the evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-e2e-android
          path: |
            mobile/metro.log
            maestro-report.xml
            ~/.maestro/tests/
          retention-days: 7

      - name: Stop snip
        if: always()
        working-directory: snip
        run: docker compose down -v

  # The same flow on an iPhone simulator. macOS runners have no Docker, so snip
  # runs straight from Go with its in-memory store, which prints a development
  # key at startup; the simulator shares the Mac's network, so the app's
  # default address, localhost:8080, reaches it.
  #
  # It doesn't fail the workflow: on CI Macs, the XCUITest driver Maestro
  # starts first sometimes never comes up (xcodebuild picks the simulator and
  # stops there), before the app is touched; that happened on two runs of
  # three. When the driver does start, a failure here is a real iOS failure:
  # look at the job, not only the workflow's tick.
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true
    env:
      MAESTRO_VERSION: 2.12.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6     # Maestro runs on Java
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-go@v7
        with:
          go-version-file: snip/go.mod
          cache-dependency-path: snip/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Start snip (in memory) and read its key
        working-directory: snip
        run: |
          go build -o "$RUNNER_TEMP/snip" ./cmd/snip
          nohup "$RUNNER_TEMP/snip" serve > "$RUNNER_TEMP/snip.log" 2>&1 &
          for _ in $(seq 60); do curl -fs localhost:8080/healthz && break; sleep 1; done   # macOS has no timeout(1)
          curl -fs localhost:8080/healthz
          key=$(grep -o 'snip_[A-Za-z0-9]*' "$RUNNER_TEMP/snip.log" | head -1)
          echo "::add-mask::$key"
          echo "SNIP_KEY=$key" >> "$GITHUB_ENV"

      - name: Build the iOS app (debug, for the simulator)
        working-directory: mobile
        env:
          CI: "1"
        run: |
          npm ci
          npx expo prebuild --platform ios       # generates ios/ and runs pod install (chapter 18.8)
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -1)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet
          app=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          echo "APP_PATH=$PWD/$app" >> "$GITHUB_ENV"
          echo "APP_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" >> "$GITHUB_ENV"

      - name: Start Metro
        working-directory: mobile
        env:
          CI: "1"
        run: |
          nohup npx expo start --port 8081 > metro.log 2>&1 &
          for _ in $(seq 60); do curl -s localhost:8081/status | grep -q running && break; sleep 2; done
          curl -s localhost:8081/status | grep -q running
          # Bundle once now (it took three minutes cold on a macOS runner), so
          # the app's first launch is served from Metro's cache.
          curl -sf --max-time 900 -o /dev/null "localhost:8081/node_modules/expo-router/entry.bundle?platform=ios&dev=true&minify=false"

      - name: Boot an iPhone simulator and install the app
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          echo "Using $(xcrun simctl list devices available | grep "$udid")"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$APP_PATH"

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Maestro drives the simulator through an XCUITest driver it starts
      # first; on a busy runner that can take longer than its default wait, so
      # wait longer, and try once more if the driver didn't come up. A real
      # failure in the app fails both attempts.
      - name: Drive it
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "180000"
        run: |
          run() { maestro test -e APP_ID="$APP_ID" -e KEY="$SNIP_KEY" --format junit --output maestro-report.xml mobile/e2e/snip.yaml; }
          run || { echo "::warning::First attempt failed; trying once more"; run; }

      - name: Keep the evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-e2e-ios
          path: |
            mobile/metro.log
            maestro-report.xml
            ~/.maestro/tests/
          retention-days: 7
