# Publish snip's container image to GitHub Container Registry (chapter 9.4).
# Every push to main that touches snip/ publishes :main and :sha-<commit>;
# a git tag like snip-v1.2.3 publishes :1.2.3 and :1.2.
name: snip image

on:
  push:
    branches: [main]
    paths: ["snip/**", ".github/workflows/image.yml"]
    tags: ["snip-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push to ghcr.io — nothing else

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/snip
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=match,pattern=snip-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=snip-v(\d+\.\d+),group=1
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: snip
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true                     # attach a software bill of materials
          provenance: mode=max           # and a record of how it was built
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Show what was published
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/snip@${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE"
          echo "--- SBOM (linux/amd64): packages inside the image"
          docker buildx imagetools inspect "$IMAGE" \
            --format '{{ range .SBOM.linux_amd64.SPDX.packages }}{{ .name }} {{ .versionInfo }}{{ "\n" }}{{ end }}'
      - name: Pull the published image by digest and run it
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/snip@${{ steps.build.outputs.digest }}
        run: |
          docker run -d --name snip -p 8080:8080 "$IMAGE"
          for _ in $(seq 1 20); do curl -fsS localhost:8080/healthz && exit 0; sleep 1; done
          docker logs snip; exit 1
