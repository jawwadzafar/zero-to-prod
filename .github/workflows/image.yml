# Publish snip's container images to GitHub Container Registry (chapter 9.4):
# snip itself, and snip-web, the web UI served by nginx (chapter 16.6).
# Every push to main that touches snip/ or web/ publishes both as :main and
# :sha-<commit>, so the two tags always name a matching pair; a git tag like
# snip-v1.2.3 publishes :1.2.3 and :1.2.
name: snip image

on:
  push:
    branches: [main]
    paths: ["snip/**", "web/**", ".github/workflows/image.yml"]
    tags: ["snip-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push to ghcr.io — nothing else

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:                         # same steps, two images
          - { image: snip, context: snip, check: /healthz }
          - { image: snip-web, context: web, check: /app/ }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=match,pattern=snip-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=snip-v(\d+\.\d+),group=1
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true                     # attach a software bill of materials
          provenance: mode=max           # and a record of how it was built
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Show what was published
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE"
          echo "--- SBOM (linux/amd64): packages inside the image"
          docker buildx imagetools inspect "$IMAGE" \
            --format '{{ range .SBOM.linux_amd64.SPDX.packages }}{{ .name }} {{ .versionInfo }}{{ "\n" }}{{ end }}'
      - name: Pull the published image by digest and run it
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          CHECK: ${{ matrix.check }}
        run: |
          docker run -d --name app -p 8080:8080 "$IMAGE"   # both listen on 8080
          for _ in $(seq 1 20); do curl -fsS "localhost:8080$CHECK" > /dev/null && exit 0; sleep 1; done
          docker logs app; exit 1
