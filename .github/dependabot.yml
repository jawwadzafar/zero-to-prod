# Dependabot keeps every ecosystem in this repo patched.
# Security updates arrive as soon as an advisory is published; routine version
# updates come once a week, with minor and patch bumps grouped into one PR per
# ecosystem so CI tests them together. Major versions get their own PRs.
version: 2
updates:
  - package-ecosystem: npm            # the site (/) and snip's web UI (/web)
    directories: [/, /web]
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      docusaurus:                     # Docusaurus packages must move in lockstep
        patterns: ["@docusaurus/*"]
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm            # snip's phone app (/mobile)
    directory: /mobile
    schedule: { interval: weekly }
    groups:
      mobile-minor-patch:
        update-types: [minor, patch]
    # Each Expo SDK pins its own React Native and expo-* majors; those move
    # only in an SDK upgrade, done by hand with `npx expo install expo@latest --fix`.
    ignore:
      - dependency-name: "expo*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: gomod          # snip
    directories: [/snip, /snip/examples/dockerlab]
    schedule: { interval: weekly }
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv             # the AI and Data Engineering tracks (pyproject.toml / uv.lock)
    directories: [/ai, /data]
    schedule: { interval: weekly }
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker         # Dockerfile base images
    directories: [/snip, /snip/examples/dockerlab, /web]
    schedule: { interval: weekly }
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose # images in snip/docker-compose.yml
    directory: /snip
    schedule: { interval: weekly }
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
