# The whole snip stack on your laptop (chapter 9.3):
#   docker compose up --build
# Then: docker compose exec api snip keys create me
name: snip

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: snip
      POSTGRES_PASSWORD: snip          # local development only — never a real password
      POSTGRES_DB: snip
    volumes:
      - pgdata:/var/lib/postgresql/data  # keeps data across restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snip"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  api:
    build: .
    environment: &snip-env
      SNIP_DATABASE_URL: postgres://snip:snip@postgres:5432/snip?sslmode=disable
      SNIP_REDIS_ADDR: redis:6379
      SNIP_BASE_URL: http://localhost:8080
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      replicas: 2                     # two copies behind nginx (chapter 8.3)

  worker:
    build: .
    entrypoint: ["/usr/local/bin/snip-worker"]
    environment: *snip-env
    depends_on:
      api: { condition: service_started }  # the API runs migrations first

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"                     # your browser talks to nginx, nginx to the api copies
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]       # start with: docker compose --profile observability up
    ports: ["9090:9090"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["observability"]
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"         # local development only
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:                                    # a Prometheus datasource and snip's dashboard, ready to use (chapter 13.2)
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  pgdata:
