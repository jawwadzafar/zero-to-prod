# nginx as snip's front door (chapter 8.3): one public port, requests spread
# across every api copy. Docker's DNS returns all copies for the name "api".
upstream snip_api {
    server api:8080;
    keepalive 32;               # reuse connections to the backends
}

server {
    listen 80;                  # nginx runs as uid 101, not root; Docker lets any user in a
                                # container claim ports below 1024 (Kubernetes uses 8080)

    location / {
        proxy_pass http://snip_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }

    location = /metrics {       # metrics are for Prometheus inside the network, not the internet
        deny all;
    }

    # The web UI (chapter 16.6): static files built from web/ and copied into
    # this nginx image. Same origin as the API, so the browser needs no CORS.
    # How /app/ is served (gzip, caching, security headers) lives in the web
    # image, in web/nginx/app.conf, so Kubernetes serves it the same way.
    include /etc/nginx/snippets/app.conf;
}
