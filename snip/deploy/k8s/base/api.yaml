# The snip API: a Deployment of identical, stateless Pods (chapter 10.2)
# behind a Service that load-balances across the ready ones (chapter 10.3).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  strategy:
    rollingUpdate:
      maxUnavailable: 0                     # never drop below 2 ready copies during a rollout
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      automountServiceAccountToken: false   # never calls the Kubernetes API, so no token (chapter 7.11)
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532                    # distroless "nonroot"; must be numeric for runAsNonRoot to verify it
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Runs to completion before the api container starts (chapter 7.4):
      # applies migrations as the schema's owner and sets snip_app's password
      # from snip-db. Pods starting together take turns (an advisory lock), and
      # the api container never sees the owner's login.
      initContainers:
        - name: migrate
          image: snip                       # replaced by kustomize's images: section
          args: ["migrate"]
          envFrom:
            - secretRef:
                name: snip-db-migrate
            - secretRef:
                name: snip-db
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: snip                       # replaced by kustomize's images: section
          envFrom:
            - configMapRef:
                name: snip-config
            - secretRef:
                name: snip-db
            - secretRef:
                name: snip-redis
          ports:
            - name: http
              containerPort: 8080
          startupProbe:                     # give a slow first start time before liveness counts
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:                    # alive? if this fails, restart the container
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:                   # ready for traffic? (fails only if Postgres is down; Redis down = degraded, still ready)
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          lifecycle:
            preStop:
              sleep:
                seconds: 5                  # let the Service stop routing here before shutdown starts
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 80
      targetPort: http
