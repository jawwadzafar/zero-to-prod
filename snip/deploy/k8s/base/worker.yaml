# The click-counting worker (chapter 8.2): same image, different program.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      automountServiceAccountToken: false   # never calls the Kubernetes API, so no token (chapter 7.11)
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532                    # distroless "nonroot"; must be numeric for runAsNonRoot to verify it
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: snip
          command: ["/usr/local/bin/snip-worker"]
          ports:
            - name: metrics                 # /metrics and /healthz (chapter 13.2)
              containerPort: 9091
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 10
          envFrom:
            - configMapRef:
                name: snip-config
            - secretRef:
                name: snip-db
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
