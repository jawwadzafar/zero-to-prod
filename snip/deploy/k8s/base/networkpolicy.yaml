# Who may talk to whom inside the snip namespace (chapter 10.3).
# 1. Deny all incoming traffic to every Pod by default…
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}                 # every Pod in the namespace
  policyTypes: ["Ingress"]
---
# 2. …then allow only what snip needs. The API accepts HTTP from anywhere
#    (the Gateway, port-forwards, other namespaces).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-anywhere
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 8080
---
# Postgres and Redis accept connections only from snip's own API and worker.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-snip
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [api, worker] }
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-from-snip
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [api, worker] }
      ports:
        - port: 6379
