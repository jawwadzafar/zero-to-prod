# The public entrance to snip, using the Gateway API (chapter 10.3).
# Needs a Gateway API implementation installed in the cluster; this uses
# Envoy Gateway's GatewayClass. Apply with:
#   kubectl apply -f deploy/k8s/gateway/gateway.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: snip
  namespace: snip
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: snip
  namespace: snip
spec:
  parentRefs:
    - name: snip
  hostnames:
    - snip.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: api
          port: 80
