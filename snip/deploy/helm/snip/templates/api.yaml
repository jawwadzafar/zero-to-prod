apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "snip.fullname" . }}-api
  labels: {{- include "snip.labels" . | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "snip.selector" (dict "root" . "component" "api") | nindent 6 }}
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: {{- include "snip.selector" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        # A hash of the config: changing a value changes the Pod template, so
        # Pods roll automatically (chapter 10.4's "env is read once" problem).
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false   # never calls the Kubernetes API, so no token (chapter 7.11)
      terminationGracePeriodSeconds: 30
      securityContext: {{- include "snip.podSecurity" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "snip.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef: { name: {{ include "snip.fullname" . }}-config }
            - secretRef: { name: {{ include "snip.dbSecret" . }} }
          ports:
            - { name: http, containerPort: 8080 }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: {{- include "snip.containerSecurity" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "snip.fullname" . }}-api
  labels: {{- include "snip.labels" . | nindent 4 }}
spec:
  selector: {{- include "snip.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "snip.fullname" . }}-api
  labels: {{- include "snip.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "snip.fullname" . }}-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "snip.fullname" . }}-api
  labels: {{- include "snip.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "snip.selector" (dict "root" . "component" "api") | nindent 6 }}
