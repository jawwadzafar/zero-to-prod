{{- if .Values.redis.enabled }}
{{- $name := printf "%s-redis" (include "snip.fullname" .) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "snip.labels" . | nindent 4 }}
spec:
  selector: {{- include "snip.selector" (dict "root" . "component" "redis") | nindent 4 }}
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "snip.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "snip.selector" (dict "root" . "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "snip.selector" (dict "root" . "component" "redis") | nindent 8 }}
      annotations:                          # a new password restarts Redis with it
        checksum/password: {{ .Values.redis.password | sha256sum }}
    spec:
      automountServiceAccountToken: false   # never calls the Kubernetes API, so no token (chapter 7.11)
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000                       # volumes writable by the redis group
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          # Start Redis with the password from the Secret (chapter 7.6).
          command: ["sh", "-c", 'exec redis-server --requirepass "$REDISCLI_AUTH"']
          env:
            - name: REDISCLI_AUTH           # redis-cli (the probe, kubectl exec) logs in with it too
              valueFrom:
                secretKeyRef: { name: {{ include "snip.redisSecret" . }}, key: SNIP_REDIS_PASSWORD }
          ports:
            - containerPort: 6379
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext: {{- include "snip.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - { name: data, emptyDir: {} }
{{- end }}
