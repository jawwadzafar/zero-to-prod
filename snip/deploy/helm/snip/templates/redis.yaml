{{- if .Values.redis.enabled }}
{{- $name := printf "%s-redis" (include "snip.fullname" .) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "snip.labels" . | nindent 4 }}
spec:
  selector: {{- include "snip.selector" (dict "root" . "component" "redis") | nindent 4 }}
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "snip.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "snip.selector" (dict "root" . "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "snip.selector" (dict "root" . "component" "redis") | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - containerPort: 6379
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
{{- end }}
