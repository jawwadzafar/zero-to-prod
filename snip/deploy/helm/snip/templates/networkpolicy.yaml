{{- if .Values.networkPolicy.enabled }}
{{- $inst := .Release.Name }}
# Deny incoming traffic to this release's Pods, then allow what snip needs (chapter 10.3).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "snip.fullname" . }}-default-deny
  labels: {{- include "snip.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/instance: {{ $inst }} }
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "snip.fullname" . }}-api
  labels: {{- include "snip.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "snip.selector" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 8080
{{- range $component, $port := dict "postgres" 5432 "redis" 6379 }}
{{- if (index $.Values $component).enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "snip.fullname" $ }}-{{ $component }}
  labels: {{- include "snip.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "snip.selector" (dict "root" $ "component" $component) | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/instance, operator: In, values: [{{ $inst }}] }
              - { key: app.kubernetes.io/name, operator: In, values: [api, worker] }
      ports:
        - port: {{ $port }}
{{- end }}
{{- end }}
{{- end }}
