# Default settings for the snip chart (chapter 10.6).
# Override any of these with -f my-values.yaml or --set key=value.

image:
  repository: ghcr.io/jawwadzafar/snip
  tag: ""                 # empty = the chart's appVersion
  pullPolicy: IfNotPresent

api:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { memory: 256Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

worker:
  enabled: true
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { memory: 128Mi }

# The web UI (chapter 16.6): nginx serving the static files at /app/ and
# nothing else. Built from web/Dockerfile and published next to snip's image.
web:
  enabled: true
  image:
    repository: ghcr.io/jawwadzafar/snip-web
    tag: ""               # empty = the chart's appVersion, the same tag as snip's image
  replicas: 2
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

# An HTTPRoute on an existing Gateway (chapter 10.3): /app to the web UI,
# every other path to the API, so the browser sees one origin.
route:
  enabled: false
  gateway: snip           # the Gateway's name, in this release's namespace
  hostnames: [snip.localhost]

# snip's settings (chapter 7.6). They become SNIP_* environment variables.
config:
  baseURL: http://localhost:8080
  logLevel: info
  rateLimit: 60

# Where the database connection strings come from (chapter 7.4 explains the two logins):
#  - existingSecret: a Secret you created with key SNIP_DATABASE_URL, the app's
#    own login (snip_app), e.g. by the External Secrets Operator (chapter 10.4).
#  - existingMigrateSecret: a Secret with key SNIP_MIGRATE_DATABASE_URL, the
#    schema owner's login. The API Pods' migrate init container uses it to
#    apply migrations and set snip_app's password; the API never sees it.
#    Leave it empty and the API migrates with SNIP_DATABASE_URL itself, as
#    before chapter 7.4 (then that login must own the schema).
#  - otherwise, with postgres.enabled, the chart builds both for its own Postgres.
database:
  existingSecret: ""
  existingMigrateSecret: ""

postgres:
  enabled: true           # an in-cluster Postgres for learning; use a managed database in production
  image: postgres:18-alpine
  password: snip-dev-only # the owner's (superuser's) password; development only: never put a real password in values files
  appPassword: snip-app-dev-only # snip_app's password, set by the migrate init container; development only
  storage: 1Gi

# Redis requires a password (chapter 7.6). Like the database URL, it comes from:
#  - redis.existingSecret: a Secret you created (key SNIP_REDIS_PASSWORD). Recommended.
#  - otherwise, a Secret the chart builds from redis.password.
redis:
  enabled: true
  image: redis:7-alpine
  password: snip-dev-only # development only: never put a real password in values files
  existingSecret: ""

networkPolicy:
  enabled: true

podDisruptionBudget:
  minAvailable: 1
