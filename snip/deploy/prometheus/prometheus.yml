global:
  scrape_interval: 10s
scrape_configs:
  - job_name: snip-api
    dns_sd_configs:              # find every api copy via Docker's DNS
      - names: [api]
        type: A
        port: 8080
  - job_name: snip-worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9091
