global:
  scrape_interval: 10s
  evaluation_interval: 30s
# snip's SLOs and alerts (chapter 13.4). Listed explicitly: the rules folder
# also holds their unit tests, which aren't rules.
rule_files:
  - /etc/prometheus/rules/snip-slo.yml
scrape_configs:
  - job_name: snip-api
    dns_sd_configs:              # find every api copy via Docker's DNS
      - names: [api]
        type: A
        port: 8080
  - job_name: snip-worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9091
