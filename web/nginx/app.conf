# How snip's web UI is served: compression, caching and security headers
# (chapters 16.6, 16.8, 16.10). It goes inside a server { } block. Both front
# doors include this one file, so they can't drift apart:
#   - the compose stack's nginx (snip/deploy/nginx/nginx.conf), which also
#     proxies everything else to snip's API;
#   - the web image's own server (web/nginx/default.conf), which Kubernetes
#     runs behind the Gateway (chapter 10.3).
# The slug "app" is reserved in snip, so no short link can hide behind /app.

# Compress text on the way out (chapter 16.8): the UI's JavaScript goes
# from 227 kB to 71 kB on the wire. Level 6 is the usual balance of CPU
# and size; images and fonts are already compressed, so they are left out.
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_vary on;               # "Vary: Accept-Encoding", so caches keep both versions apart

location = /app {
    absolute_redirect off;  # "Location: /app/", not a URL with nginx's own host and port
    return 301 /app/;
}

location /app/ {
    root /usr/share/nginx/html;
    try_files $uri /app/index.html;
    add_header Cache-Control "no-cache";   # always check for a new index.html
    # Security headers for the page (chapter 16.10). An add_header inside a
    # location replaces every add_header from outside it, so all of them
    # live here together. "always" adds them to error pages too.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; require-trusted-types-for 'script'" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

location /app/assets/ {     # file names carry a content hash, so they never change
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
}
