# The web image on its own, as Kubernetes runs it (chapter 10.3): it serves
# the UI at /app/ and nothing else. The Gateway sends /app to it and every
# other path to snip's API, so the browser still sees one origin.
# (The compose stack replaces this file with snip/deploy/nginx/nginx.conf.)
server {
    listen 8080;            # not 80: the image runs as an ordinary user (uid 101), and
                            # Kubernetes doesn't promise one may claim ports below 1024

    include /etc/nginx/snippets/app.conf;

    location / {            # anything outside /app/ isn't this server's business
        return 404;
    }
}
